name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          (Get-Content LitLauncher.py -Encoding utf8) -replace '^APP_VERSION = ".*"', "APP_VERSION = `"$v`"" | Set-Content LitLauncher.py -Encoding utf8
          echo "APP_VER=$v" >> $env:GITHUB_ENV

      - name: Build LitLauncher.exe
        run: python -m PyInstaller --noconfirm --onefile --noconsole --name LitLauncher --icon icon.ico LitLauncher.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Setup
        shell: pwsh
        run: |
          $v = if ($env:APP_VER) { $env:APP_VER } else { "0.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: LitLauncher-windows
          path: dist/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
